<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <title>Slope Translator</title>

  <!-- PWA 필수 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.svg" />

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 1rem;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    h1 {
      text-align: center;
      font-size: 1.5rem;
      color: var(--primary);
      padding: 1rem 0;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .input-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }
    input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1.125rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="number"]:focus {
      border-color: var(--primary);
    }
    .ratio-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
    }
    .ratio-btn {
      padding: 0.75rem 0;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: transparent;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .ratio-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .mode-grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:0.5rem;
    }
    .mode-btn{
      padding:0.75rem 0;
      border:1px solid var(--border);
      border-radius:0.5rem;
      background:transparent;
      font-size:0.95rem;
      font-weight:700;
      color: var(--text-muted);
      cursor:pointer;
      transition: all 0.2s;
    }
    .mode-btn.active{
      background-color: var(--primary);
      color:#fff;
      border-color: var(--primary);
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    .result-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .result-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .result-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }
    .unit {
      font-size: 0.875rem;
      color: var(--text-main);
      font-weight: 500;
    }
    .footer-text {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      margin-bottom: 0.5rem;
    }

    /* 모드에 따라 “대표값”을 크게 보이게 하는 클래스 */
    .primary-metric .result-value{
      font-size: 1.55rem;
    }
    .secondary-metric .result-value{
      font-size: 1.05rem;
      color: var(--text-main);
    }
    .secondary-metric .result-label{
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="app-container">
    <h1>Slope Translator</h1>

    <div class="card">
      <div class="input-group">
        <label for="riseInput">단차 (cm)</label>
        <input type="number" id="riseInput" placeholder="단차를 입력하세요" inputmode="decimal" />
      </div>

      <div class="input-group" style="margin-bottom: 0;">
        <label>기준 비율 선택</label>
        <div class="ratio-grid">
          <button class="ratio-btn" data-ratio="8">1:8</button>
          <button class="ratio-btn" data-ratio="10">1:10</button>
          <button class="ratio-btn active" data-ratio="12">1:12</button>
          <button class="ratio-btn" data-ratio="15">1:15</button>
          <button class="ratio-btn" data-ratio="20">1:20</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="input-group" style="margin-bottom: 0;">
        <label>산업별 보기</label>
        <div class="mode-grid">
          <button class="mode-btn active" data-mode="arch">건축</button>
          <button class="mode-btn" data-mode="civil">토목</button>
          <button class="mode-btn" data-mode="eng">엔지니어링</button>
        </div>
      </div>
    </div>

    <div class="card result-grid">
      <div class="result-item">
        <span class="result-label">필요 수평길이</span>
        <div class="result-value"><span id="outRun">0.00</span> <span class="unit">m</span></div>
      </div>

      <div class="result-item">
        <span class="result-label">비율</span>
        <div class="result-value" id="outRatio">1:12</div>
      </div>

      <div class="result-item">
        <span class="result-label">경사도</span>
        <div class="result-value"><span id="outGrade">8.33</span> <span class="unit">%</span></div>
      </div>

      <div class="result-item">
        <span class="result-label">각도</span>
        <div class="result-value"><span id="outAngle">4.76</span> <span class="unit">°</span></div>
      </div>
    </div>

    <p class="footer-text">본 결과는 참고용이며 실제 시공 전 현장 실측을 권장합니다.</p>
  </div>

  <script>
    const riseInput = document.getElementById('riseInput');
    const ratioBtns = document.querySelectorAll('.ratio-btn');

    const outRun = document.getElementById('outRun');
    const outRatio = document.getElementById('outRatio');
    const outGrade = document.getElementById('outGrade');
    const outAngle = document.getElementById('outAngle');

    // 결과 항목(4개)
    const resultItems = document.querySelectorAll('.result-item');
    const itemRun = resultItems[0];
    const itemRatio = resultItems[1];
    const itemGrade = resultItems[2];
    const itemAngle = resultItems[3];

    // 모드 버튼
    const modeBtns = document.querySelectorAll('.mode-btn');

    let currentRatio = 12;
    let currentMode = 'arch'; // arch | civil | eng

    function setPrimary(item) {
      [itemRun, itemRatio, itemGrade, itemAngle].forEach(i => {
        i.classList.remove('primary-metric', 'secondary-metric');
        i.classList.add('secondary-metric');
      });
      item.classList.remove('secondary-metric');
      item.classList.add('primary-metric');
    }

    function applyMode() {
      if (currentMode === 'arch') setPrimary(itemRatio);       // 건축: 1:n
      else if (currentMode === 'civil') setPrimary(itemGrade); // 토목: %
      else setPrimary(itemAngle);                               // 엔지: °
    }

    function calculate() {
      const riseCm = parseFloat(riseInput.value) || 0;

      const runCm = riseCm * currentRatio;
      const runM = runCm / 100;
      const gradePercent = 100 / currentRatio;
      const angleDeg = Math.atan(1 / currentRatio) * (180 / Math.PI);

      outRun.textContent = runM.toFixed(2);
      outRatio.textContent = `1:${currentRatio}`;
      outGrade.textContent = gradePercent.toFixed(2);
      outAngle.textContent = angleDeg.toFixed(2);

      applyMode();
    }

    riseInput.addEventListener('input', calculate);

    ratioBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        ratioBtns.forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentRatio = parseInt(e.currentTarget.dataset.ratio, 10);
        calculate();
      });
    });

    modeBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        modeBtns.forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentMode = e.currentTarget.dataset.mode;
        calculate();
      });
    });

    calculate();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
