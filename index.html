<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <title>Slope Translator</title>

  <style>
    :root{
      --primary:#2563eb;
      --bg:#f1f5f9;
      --card-bg:#ffffff;
      --text-main:#1e293b;
      --text-muted:#64748b;
      --border:#e2e8f0;
      --good:#16a34a;
      --warn:#f59e0b;
      --bad:#ef4444;
    }
    *{
      box-sizing:border-box;margin:0;padding:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-tap-highlight-color:transparent;
    }
    body{
      background:var(--bg);color:var(--text-main);
      display:flex;justify-content:center;padding:1rem;
    }
    .app-container{
      width:100%;max-width:560px;
      display:flex;flex-direction:column;gap:1.25rem;
    }
    h1{ text-align:center;font-size:1.5rem;color:var(--primary);padding:1rem 0; }
    .card{
      background:var(--card-bg);
      border-radius:1rem;
      padding:1.25rem;
      box-shadow:0 4px 6px -1px rgba(0,0,0,.10),0 2px 4px -2px rgba(0,0,0,.10);
    }
    .input-group{ display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem; }
    .input-group label{ font-size:.875rem;font-weight:700; }
    input[type="number"]{
      width:100%;
      padding:.75rem 1rem;
      font-size:1.125rem;
      border:1px solid var(--border);
      border-radius:.5rem;
      outline:none;
      transition:border-color .2s;
    }
    input[type="number"]:focus{ border-color:var(--primary); }

    .grid-3{ display:grid; grid-template-columns:repeat(3, 1fr); gap:.5rem; }
    .btn{
      padding:.75rem .5rem;
      border:1px solid var(--border);
      border-radius:.6rem;
      background:transparent;
      font-size:.95rem;
      font-weight:800;
      color:var(--text-muted);
      cursor:pointer;
      transition:all .2s;
      text-align:center;
      line-height:1.1;
      user-select:none;
    }
    .btn small{ display:block;font-weight:700;font-size:.75rem;opacity:.85;margin-top:.25rem; }
    .btn.active{ background:var(--primary);color:#fff;border-color:var(--primary); }

    .result-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1rem;
    }
    .result-item{ display:flex;flex-direction:column;gap:.25rem; }
    .result-label{ font-size:.75rem;color:var(--text-muted); }
    .result-value{ font-size:1.35rem;font-weight:900;color:var(--primary); }
    .unit{ font-size:.9rem;color:var(--text-main);font-weight:700; }

    .badge{
      display:inline-flex;align-items:center;gap:.4rem;
      padding:.35rem .55rem;
      border-radius:999px;
      font-size:.78rem;
      font-weight:800;
      border:1px solid var(--border);
      color:var(--text-main);
      background:#fff;
    }
    .dot{ width:.55rem;height:.55rem;border-radius:50%;display:inline-block; }
    .dot.good{ background:var(--good); }
    .dot.warn{ background:var(--warn); }
    .dot.bad{ background:var(--bad); }

    .table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      overflow:hidden;
      border:1px solid var(--border);
      border-radius:.75rem;
    }
    .table th,.table td{
      padding:.75rem .75rem;
      font-size:.9rem;
      border-bottom:1px solid var(--border);
      text-align:left;
      background:#fff;
    }
    .table th{ background:#f8fafc;font-size:.82rem;color:var(--text-muted);font-weight:900; }
    .table tr:last-child td{ border-bottom:none; }
    .mono{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum"; }
    .muted{ color:var(--text-muted); font-size:.8rem; line-height:1.45; }
    .footer-text{ text-align:center;font-size:.75rem;color:var(--text-muted);margin-top:.25rem; }
  </style>
</head>

<body>
  <div class="app-container">
    <h1>Slope Translator</h1>

    <!-- 입력 -->
    <div class="card">
      <div class="input-group">
        <label for="riseInput">단차 (cm)</label>
        <input type="number" id="riseInput" placeholder="단차를 입력하세요" inputmode="decimal" />
      </div>

      <div class="input-group" style="margin-bottom:0;">
        <label>법규 기준 빠른 선택</label>
        <div class="grid-3" id="presetWrap">
          <button class="btn active" data-ratio="12">
            기본 1:12
            <small>경사로 기본</small>
          </button>
          <button class="btn" data-ratio="8">
            완화 1:8
            <small>예외/완화</small>
          </button>
          <button class="btn" data-ratio="24">
            평지 1:24
            <small>완만 기준</small>
          </button>
        </div>
        <div class="muted" style="margin-top:.6rem;">
          ※ 실제 적용은 시설 유형·구간 길이·단차 높이·참/중간참(landing) 등 조건에 따라 달라질 수 있습니다.  
          이 도구는 “계산/비교” 보조용입니다.
        </div>
      </div>
    </div>

    <!-- 대표 결과 -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem;">
        <div style="font-weight:900;">선택 기준 결과</div>
        <span class="badge" id="statusBadge">
          <span class="dot good" id="statusDot"></span>
          <span id="statusText">기본(1:12) 선택됨</span>
        </span>
      </div>

      <div class="result-grid">
        <div class="result-item">
          <span class="result-label">필요 수평길이</span>
          <div class="result-value"><span class="mono" id="outRun">0.00</span> <span class="unit">m</span></div>
        </div>
        <div class="result-item">
          <span class="result-label">비율</span>
          <div class="result-value mono" style="color:var(--text-main);" id="outRatio">1:12</div>
        </div>
        <div class="result-item">
          <span class="result-label">경사도</span>
          <div class="result-value"><span class="mono" id="outGrade">8.33</span> <span class="unit">%</span></div>
        </div>
        <div class="result-item">
          <span class="result-label">각도</span>
          <div class="result-value"><span class="mono" id="outAngle">4.76</span> <span class="unit">°</span></div>
        </div>
      </div>
    </div>

    <!-- 기준 비교표 -->
    <div class="card">
      <div style="font-weight:900;margin-bottom:.75rem;">기준별 비교 (단차 기준)</div>
      <table class="table">
        <thead>
          <tr>
            <th style="width:34%;">기준</th>
            <th style="width:22%;">비율</th>
            <th style="width:22%;">경사도</th>
            <th style="width:22%;">필요 수평길이</th>
          </tr>
        </thead>
        <tbody id="compareBody"></tbody>
      </table>
      <p class="footer-text">본 결과는 참고용이며 실제 시공 전 현장 실측 및 관련 기준 확인을 권장합니다.</p>
    </div>
  </div>

  <script>
    const riseInput = document.getElementById('riseInput');

    const outRun   = document.getElementById('outRun');
    const outRatio = document.getElementById('outRatio');
    const outGrade = document.getElementById('outGrade');
    const outAngle = document.getElementById('outAngle');

    const presetWrap  = document.getElementById('presetWrap');
    const presetBtns  = presetWrap.querySelectorAll('.btn');

    const compareBody = document.getElementById('compareBody');

    const statusDot  = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    // 조대표님이 말씀하신 “자주 쓰는 프리셋”을 기본 제공
    // (표현/적용 조건은 기관/시설별로 다를 수 있음)
    const STANDARDS = [
      { key:'flat',  label:'평지(완만)', ratio:24 },
      { key:'base',  label:'기본',       ratio:12 },
      { key:'relax', label:'완화',       ratio: 8 },
    ];

    let currentRatio = 12;

    function gradePercent(ratio){ return 100 / ratio; }
    function angleDeg(ratio){ return Math.atan(1 / ratio) * (180 / Math.PI); }

    function runMeters(riseCm, ratio){
      const runCm = riseCm * ratio;
      return runCm / 100;
    }

    function setStatusByRatio(ratio){
      // “좋음/주의/강함(급경사)” 같은 표시를 UX로 주되,
      // 법적 판정 문구는 과장하지 않고 “선택됨/참고”로 유지
      if(ratio >= 24){
        statusDot.className = 'dot good';
        statusText.textContent = '평지(1:24) 선택됨';
      }else if(ratio >= 12){
        statusDot.className = 'dot good';
        statusText.textContent = '기본(1:12) 또는 그보다 완만 (참고)';
      }else if(ratio >= 8){
        statusDot.className = 'dot warn';
        statusText.textContent = '완화(1:8) 수준 (적용 조건 확인 필요)';
      }else{
        statusDot.className = 'dot bad';
        statusText.textContent = '급경사 영역 (주의)';
      }
    }

    function renderCompare(riseCm){
      compareBody.innerHTML = '';
      STANDARDS.forEach(s => {
        const tr = document.createElement('tr');

        const td1 = document.createElement('td');
        td1.innerHTML = `<strong>${s.label}</strong>`;

        const td2 = document.createElement('td');
        td2.className = 'mono';
        td2.textContent = `1:${s.ratio}`;

        const td3 = document.createElement('td');
        td3.className = 'mono';
        td3.textContent = `${gradePercent(s.ratio).toFixed(2)}%`;

        const td4 = document.createElement('td');
        td4.className = 'mono';
        td4.textContent = `${runMeters(riseCm, s.ratio).toFixed(2)} m`;

        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4);
        compareBody.appendChild(tr);
      });
    }

    function calculate(){
      const riseCm = parseFloat(riseInput.value) || 0;

      outRun.textContent   = runMeters(riseCm, currentRatio).toFixed(2);
      outRatio.textContent = `1:${currentRatio}`;
      outGrade.textContent = gradePercent(currentRatio).toFixed(2);
      outAngle.textContent = angleDeg(currentRatio).toFixed(2);

      setStatusByRatio(currentRatio);
      renderCompare(riseCm);
    }

    riseInput.addEventListener('input', calculate);

    presetBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        presetBtns.forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        currentRatio = parseInt(e.currentTarget.dataset.ratio, 10);
        calculate();
      });
    });

    calculate();
  </script>
</body>
</html>
